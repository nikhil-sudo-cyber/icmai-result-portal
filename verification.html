<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verification Result : June-2023</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="site-header">
    <div class="brand">The Institute Of Cost Accountants Of India</div>
  </div>

  <main class="form-body">
    <div class="back-link"><a href="index.html">Back</a></div>
    <h2>Verification Result : June-2023</h2>

    <form id="verificationForm" onsubmit="return showVerifiedResult()">
      <label for="regNumber">Registration Number</label>
      <input id="regNumber" name="regNumber" type="text" placeholder="Enter registration number" required />
      <button type="submit">Show Verified Result</button>
    </form>

    <div class="page-note">ICMAI CMA Reverification Results</div>
  </main>

  <script>
    function showVerifiedResult() {
      const regNumber = document.getElementById('regNumber').value.trim();
      if (!regNumber) {
        return false;
      }
      window.location.href = 'result.html?reg=' + encodeURIComponent(regNumber);
      return false;
    }
  </script>
</body>
</html>
